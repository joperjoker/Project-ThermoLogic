[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thermologic"
version = "0.1.0"
description = "A differentiable logic-energy layer for AI outputs: score logical inconsistency and repair outputs to satisfy hard rules at a controllable compute budget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Teo Qing Cong Eugene" }]
keywords = [
    "neuro-symbolic", "energy-based-model", "differentiable-logic",
    "fuzzy-logic", "t-norm", "constraint-satisfaction", "hallucination",
    "pytorch", "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
experiments = ["numpy", "matplotlib"]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/joperjoker/Project-ThermoLogic"
Repository = "https://github.com/joperjoker/Project-ThermoLogic"
Demo = "https://joperjoker.github.io/Project-ThermoLogic/"
Author = "https://www.linkedin.com/in/eugene-teo"

[tool.setuptools]
packages = ["thermologic"]

[tool.setuptools.package-data]
thermologic = ["py.typed"]
